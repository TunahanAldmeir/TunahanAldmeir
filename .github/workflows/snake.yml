# Katkı grafiğini yiyen yılan animasyonunu üretir ve `output` dalına yazar.
# README bu dalı ham (raw) adresten gösterir; dış bir servise bağımlı değildir.
name: Yılan animasyonu

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - name: SVG'leri üret
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: output dalına gönder
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
